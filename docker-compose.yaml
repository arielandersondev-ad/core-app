services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-core_app_dev}
      POSTGRES_USER: ${POSTGRES_USER:-core_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el .env raíz}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-core_app} -d ${POSTGRES_DB:-core_app_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-test:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: ${POSTGRES_TEST_DB:-core_app_test}
      POSTGRES_USER: ${POSTGRES_TEST_USER:-core_app_test}
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:-core_app_test}
    ports:
      - "${POSTGRES_TEST_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_TEST_USER:-core_app_test} -d ${POSTGRES_TEST_DB:-core_app_test}"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
